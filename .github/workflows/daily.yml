name: daily-rebalance

on:
  schedule:
    # 21:30 UTC on weekdays = 4:30pm ET in winter, 5:30pm ET in summer (always after the 4pm close)
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-rebalance
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run daily bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m bot.run_daily
      - name: Commit logs and book
        run: |
          git config user.name "rebalance-bot"
          git config user.email "rebalance-bot@users.noreply.github.com"
          git add logs state reports
          git diff --cached --quiet || git commit -m "daily run $(date -u +%F)"
          git push
